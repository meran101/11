<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <!-- استدعاء أيقونات FontAwesome للروابط والحسابات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.bio {
            color: #9aa0a6;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* تنسيقات أزرار الروابط والحسابات الشخصية */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #161b26;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #232a3b;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover {
            background: #232a3b;
            border-color: #00ff88;
            color: #00ff88;
            transform: translateY(-2px);
        }

        /* تنسيقات الزر ثلاثي الأبعاد (Canvas / Switch) */
        .switch-container {
            position: relative;
            width: 140px;
            height: 70px;
            background: #e0e5ec;
            border-radius: 35px;
            box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 5px;
            margin: 0 auto;
            transition: all 0.4s ease;
        }

        .switch-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e0e5ec;
            box-shadow: 5px 5px 10px #b8b9be, -5px -5px 10px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .sun-icon {
            width: 26px;
            height: 26px;
            background: #ffb703;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffb703;
        }

        .canvas-holder {
            position: relative;
            margin-top: 15px;
        }

        canvas#stage {
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>أهلاً بك في موقعي الشخصي</h1>
        <p class="bio">هنا روابطي وحساباتي الشخصية الرسمية</p>

        <!-- أزرار الروابط والحسابات (يمكنك تغيير الروابط لروابطك الحقيقية) -->
        <div class="links-container">
            <a href="https://github.com/meran101" target="_blank" class="link-btn">
                <i class="fab fa-github"></i> حسابي على GitHub
            </a>
            <a href="https://t.me" target="_blank" class="link-btn">
                <i class="fab fa-telegram"></i> قناة التليجرام
            </a>
            <a href="https://instagram.com" target="_blank" class="link-btn">
                <i class="fab fa-instagram"></i> حساب الانستغرام
            </a>
        </div>

        <!-- الزر التفاعلي ثلاثي الأبعاد -->
        <div class="switch-container" id="themeSwitch">
            <div class="switch-button" id="switchBtn">
                <div class="sun-icon"></div>
            </div>
        </div>

        <!-- لوحة رسم الشخصية المتحركة (Canvas) -->
        <div class="canvas-holder">
            <canvas id="stage" width="200" height="80"></canvas>
        </div>
    </div>

    <script>
        // كود تحكم الزر ثلاثي الأبعاد
        const switchBtn = document.getElementById('switchBtn');
        const themeSwitch = document.getElementById('themeSwitch');
        let isToggled = false;

        themeSwitch.addEventListener('click', () => {
            isToggled = !isToggled;
            if (isToggled) {
                switchBtn.style.transform = 'translateX(-70px)';
                document.body.style.backgroundColor = '#151922';
            } else {
                switchBtn.style.transform = 'translateX(0px)';
                document.body.style.backgroundColor = '#0b0f19';
            }
        });

        // كود محاكاة الحركة ورسم الأنيميشن على الـ Canvas
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        let x = 100;
        let y = 40;
        let angle = 0;

        function updatePhysics() {
            angle += 0.05;
        }

        function drawStickman() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // الرأس
            ctx.beginPath();
            ctx.arc(x, y - 18 + Math.sin(angle) * 3, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#00ff88';
            ctx.fill();

            // الجسد
            ctx.beginPath();
            ctx.moveTo(x, y - 11);
            ctx.lineTo(x, y + 10);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // الأرجل
            ctx.beginPath();
            ctx.moveTo(x, y + 10);
            ctx.lineTo(x - 7 + Math.sin(angle) * 5, y + 22);
            ctx.moveTo(x, y + 10);
            ctx.lineTo(x + 7 - Math.sin(angle) * 5, y + 22);
            ctx.stroke();
        }

        function renderLoop() {
            updatePhysics();
            drawStickman();
            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>

</body>
</html>
