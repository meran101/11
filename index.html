<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Meran Alyas | TIGER Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google tag (gtag.js) - إحصائيات زوار خفية -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPT5W1N92S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RPT5W1N92S');

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas للخلفية المتحركة مع تفعيل التسريع بواسطة GPU */
        #cyberCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0);
        }

        /* تأثير خط الليزر المتحرك خفيف الأداء */
        .laser-scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            box-shadow: 0 0 10px #00f0ff;
            z-index: 1;
            opacity: 0.6;
            animation: scanlineMove 8s linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        /* Matrix Rain Effect */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            opacity: 0.45;
            will-change: transform;
        }

        .matrix-column {
            position: absolute;
            top: -50%;
            width: 2px;
            height: 120px;
            background: linear-gradient(180deg, transparent, #00b4d8, #0077b6);
            box-shadow: 0 0 6px rgba(0, 150, 255, 0.8);
            animation: rainFall linear infinite;
            will-change: transform;
        }

        @keyframes rainFall {
            0% { transform: translateY(-120px); }
            100% { transform: translateY(120vh); }
        }

        /* Navigation Buttons */
        .nav-container {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.7));
            color: #e2e8f0;
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 14px;
            padding: 10px 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: center;
            outline: none;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.9), rgba(0, 180, 216, 0.8));
            color: #ffffff;
            border-color: rgba(0, 240, 255, 1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(0, 180, 216, 0.3);
            margin: 15px 0;
        }

        /* Page Transitions & Content */
        .page {
            display: none;
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes pageSlideIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Banner & Profile Styling */
        .profile-header-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .banner-bg {
            width: 100%;
            height: 140px;
            border-radius: 20px;
            background-image: url('download.gif');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.4);
        }

        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: -60px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #020617;
            box-shadow: 0px 0px 25px rgba(0, 240, 255, 0.8);
            background-color: #020617;
        }

        .profile-name {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-top: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 180, 216, 0.6);
        }

        .title-animation {
            text-align: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .subtitle-animation {
            text-align: center;
            color: #00f0ff;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Social Links */
        .social-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .social-btn:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }

        .insta-btn { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .snap-btn { background: #FFFC00; color: #000000; }
        .threads-btn { background: #101010; color: #ffffff; border: 1px solid #333333; }

        /* About Card */
        .water-banner-card {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.35), rgba(0, 180, 216, 0.2)), rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.6);
            border-radius: 20px;
            padding: 25px;
            margin-top: 15px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="cyberCanvas"></canvas>
    <div class="laser-scanline"></div>
    <div class="matrix-rain" id="matrixRain"></div>

    <div class="container">
        <div class="nav-container">
            <button class="nav-btn" id="homeBtn" onclick="showPage('home')">🏠 Home</button>
            <button class="nav-btn" id="aboutBtn" onclick="showPage('about')">👤 About</button>
            <button class="nav-btn" id="langBtn" onclick="toggleLang()">العربية 🌐</button>
        </div>

        <hr>

        <!-- Home Page -->
        <div id="homePage" class="page active">
            <div class="profile-header-wrapper">
                <div class="banner-bg"></div>
                <div class="profile-container">
                    <img src="IMG_20240908_230026_233.jpg" class="profile-img" alt="Meran Alyas">
                </div>
            </div>

            <div class="profile-name">MERAN</div>

            <h1 class="title-animation" id="mainTitle">Welcome To My Account 👋</h1>
            <p class="subtitle-animation" id="subTitle">My social media accounts</p>

            <div class="social-container">
                <a href="https://www.instagram.com/meran.alyas/?__pwa=1" target="_blank" class="social-btn insta-btn"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.snapchat.com/add/meran.alyas" target="_blank" class="social-btn snap-btn"><i class="fa-brands fa-snapchat"></i></a>
                <a href="https://www.threads.net/@meran.alyas" target="_blank" class="social-btn threads-btn"><i class="fa-brands fa-threads"></i></a>
            </div>
        </div>

        <!-- About Page -->
        <div id="aboutPage" class="page">
            <h2 style="text-align: center; color: #00f0ff; margin-bottom: 15px;" id="aboutTitle">About Me 👤</h2>
            <div class="water-banner-card">
                <p style="font-size: 20px; font-weight: 700; color: #00f0ff; margin: 0;">🤖 Owner of TIGER Bot 🐅</p>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain Generation (مخفف للعمل بمرونة على الموبايل)
        const rainContainer = id => document.getElementById(id);
        let rainHtml = '';
        const rainColumns = window.innerWidth < 600 ? 15 : 25;
        for (let i = 0; i < rainColumns; i++) {
            let leftPos = (i / rainColumns) * 100;
            let duration = 0.9 + (i % 4) * 0.4;
            rainHtml += `<div class="matrix-column" style="left: ${leftPos}%; animation-duration: ${duration}s;"></div>`;
        }
        rainContainer('matrixRain').innerHTML = rainHtml;

        // Interactive Cyber Particles Canvas (معدل لسلاسة الموبايل)
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');

        const isMobile = window.innerWidth < 600;
        const particleCount = isMobile ? 22 : 50;
        const connectionDistSq = isMobile ? 90 * 90 : 120 * 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * (isMobile ? 0.8 : 1.2);
                this.vy = (Math.random() - 0.5) * (isMobile ? 0.8 : 1.2);
                this.radius = Math.random() * 1.5 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff';
                if (!isMobile) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00f0ff';
                }
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < connectionDistSq) {
                        const alpha = 1 - (distSq / connectionDistSq);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${alpha.toFixed(2)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Language & Navigation
        let currentLang = 'en';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            if (pageId === 'home') {
                document.getElementById('homePage').classList.add('active');
            } else if (pageId === 'about') {
                document.getElementById('aboutPage').classList.add('active');
            }
        }

        function toggleLang() {
            if (currentLang === 'en') {
                currentLang = 'ar';
                document.documentElement.dir = 'rtl';
                document.getElementById('homeBtn').innerText = '🏠 الرئيسية';
                document.getElementById('aboutBtn').innerText = '👤 عني';
                document.getElementById('langBtn').innerText = 'English 🌐';
                
                document.getElementById('mainTitle').innerText = 'أهلاً بك في حسابي 👋';
                document.getElementById('subTitle').innerText = 'حساباتي على وسائل التواصل الاجتماعي';
                document.getElementById('aboutTitle').innerText = 'نبذة عني 👤';
            } else {
                currentLang = 'en';
                document.documentElement.dir = 'ltr';
                document.getElementById('homeBtn').innerText = '🏠 Home';
                document.getElementById('aboutBtn').innerText = '👤 About';
                document.getElementById('langBtn').innerText = 'العربية 🌐';
                
                document.getElementById('mainTitle').innerText = 'Welcome To My Account 👋';
                document.getElementById('subTitle').innerText = 'My social media accounts';
                document.getElementById('aboutTitle').innerText = 'About Me 👤';
            }
        }
    </script>
</body>
</html>
