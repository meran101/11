<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <style>
        /* تنسيقات الموقع الأساسية وتصميم الماتريكس */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        /* تنسيقات الزر التفاعلي الجديدة */
        .button-wrapper {
            position: relative;
            z-index: 10;
            display: inline-block;
            margin: 20px auto;
        }

        .canvas-holder {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 0 auto;
        }

        canvas#stage {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>أهلاً بك في موقعي الشخصي</h1>
    <p>هنا روابطي وحساباتي الشخصية</p>

    <!-- عنصر الزر التفاعلي الجديد -->
    <div class="button-wrapper">
        <div class="canvas-holder">
            <canvas id="stage"></canvas>
        </div>
    </div>

    <!-- كود الجافاسكريبت للتحكم بالحركة والفيزياء للزر -->
    <script>
        function renderLoop() {
            // تحديث محاكاة الفيزياء والرسومات
            if (typeof updatePhysics === 'function') updatePhysics();
            if (typeof drawHole === 'function') drawHole();
            if (typeof drawStickman === 'function') drawStickman();
            
            requestAnimationFrame(renderLoop);
        }

        // بدء التشغيل التلقائي للأنيميشن
        // requestAnimationFrame(renderLoop);
    </script>

</body>
</html>
