<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Meran Alyas | TIGER Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.55.0/build/stlite.css">
</head>
<body style="margin:0; background-color: #050505;">
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.55.0/build/stlite.js"></script>
    <script>
    stlite.mount({
        stliteLoader: false,
        requirements: ["streamlit"],
        entrypoint: "app.py",
        files: {
            "app.py": `
import streamlit as st
import base64

if "current_page" not in st.session_state:
    st.session_state.current_page = "home"

if "lang" not in st.session_state:
    st.session_state.lang = "en"

def set_page(page_name):
    st.session_state.current_page = page_name

def toggle_language():
    st.session_state.lang = "ar" if st.session_state.lang == "en" else "en"

hide_streamlit_style = \"\"\"
<style>
#MainMenu {visibility: hidden;}
footer {visibility: hidden;}
header {visibility: hidden;}
.stAppDeployButton {display: none !important;}
div[data-testid="stDecoration"] {display: none !important;}

.stMainBlockContainer, .block-container {
    padding-top: 0.8rem !important;
    padding-bottom: 1rem !important;
}

.stApp {
    background-color: #050505;
    color: #ffffff;
}

.matrix-rain {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 1; overflow: hidden; opacity: 0.6;
}

.matrix-column {
    position: absolute; top: -50%; width: 2px; height: 120px;
    background: linear-gradient(180deg, transparent, #00b4d8, #0077b6);
    box-shadow: 0 0 8px rgba(0, 150, 255, 0.9), 0 0 3px rgba(0, 212, 255, 0.7);
    animation: rainFall linear infinite;
}

@keyframes rainFall {
    0% { transform: translateY(-120px); }
    100% { transform: translateY(120vh); }
}

div[data-testid="horizontal-block"], div.row-widget.stHorizontal, [data-testid="stHorizontalBlock"] {
    display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important;
    gap: 10px !important; align-items: center !important; width: 100% !important;
}

div[data-testid="column"], [data-testid="stColumn"] {
    flex: 1 1 0% !important; min-width: 0 !important; max-width: 100% !important;
}

div.stButton > button {
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.6)) !important;
    color: #e2e8f0 !important; border: 1px solid rgba(0, 180, 216, 0.3) !important;
    border-radius: 14px !important; padding: 8px 12px !important; font-size: 12px !important;
    font-weight: 600 !important; transition: all 0.3s ease !important; width: 100% !important;
    backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important;
}

div.stButton > button:hover {
    background: linear-gradient(135deg, rgba(0, 119, 182, 0.9), rgba(0, 180, 216, 0.7)) !important;
    color: #ffffff !important; border-color: rgba(0, 212, 255, 0.9) !important;
    box-shadow: 0 0 25px rgba(0, 180, 216, 0.6) !important; transform: translateY(-2px);
}

.page-transition {
    animation: pageSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pageSlideIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.97); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

.profile-container {
    display: flex; justify-content: center; align-items: center; margin-top: 15px; margin-bottom: 20px;
    position: relative; z-index: 10;
}

.profile-img {
    width: 125px !important; height: 125px !important; border-radius: 50% !important;
    object-fit: cover !important; border: 3px solid #00b4d8 !important;
    box-shadow: 0px 0px 30px rgba(0, 180, 216, 0.8); position: relative; z-index: 2;
}

.title-animation {
    text-align: center; color: #ffffff; font-weight: 800; font-size: 26px; position: relative; z-index: 10;
}

.subtitle-animation {
    text-align: center; color: #00b4d8; font-size: 15px; position: relative; z-index: 10;
}

.social-container {
    display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; position: relative; z-index: 10;
}

.social-btn {
    display: inline-flex; justify-content: center; align-items: center; width: 45px; height: 45px;
    border-radius: 50%; color: white; font-size: 22px; text-decoration: none; transition: all 0.4s ease;
}
.insta-btn { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.snap-btn { background: #FFFC00; color: #000000; }
.threads-btn { background: #101010; color: #ffffff; border: 1px solid #333333; }

.water-banner-card {
    position: relative; background: linear-gradient(135deg, rgba(0, 119, 182, 0.3), rgba(0, 180, 216, 0.15)), rgba(15, 15, 15, 0.85);
    border: 1px solid rgba(0, 180, 216, 0.6); border-radius: 20px; padding: 25px; margin-top: 15px;
    box-shadow: 0 0 35px rgba(0, 150, 255, 0.3); backdrop-filter: blur(12px); z-index: 10; text-align: center;
}
</style>
\"\"\"

st.markdown(hide_streamlit_style, unsafe_allow_html=True)

rain_html = '<div class="matrix-rain">'
for i in range(25):
    left_pos = i * 4
    rain_html += f'<div class="matrix-column" style="left: {left_pos}%; animation-duration: {0.8 + (i % 4) * 0.4}s;"></div>'
rain_html += '</div>'
st.markdown(rain_html, unsafe_allow_html=True)
st.markdown('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">', unsafe_allow_html=True)

col1, col2, col3 = st.columns(3)
with col1:
    st.button("🏠 الرئيسية" if st.session_state.lang == "ar" else "🏠 Home", on_click=set_page, args=("home",), key="btn_h")
with col2:
    st.button("👤 عني" if st.session_state.lang == "ar" else "👤 About", on_click=set_page, args=("about",), key="btn_a")
with col3:
    st.button("العربية 🌐" if st.session_state.lang == "en" else "English 🌐", on_click=toggle_language, key="btn_l")

st.markdown("<hr style='border-color: rgba(0, 180, 216, 0.25); margin: 15px 0; position: relative; z-index: 10;'>", unsafe_allow_html=True)
st.markdown('<div class="page-transition">', unsafe_allow_html=True)

if st.session_state.current_page == "home":
    try:
        with open("IMG_20240908_230026_233.jpg", "rb") as f:
            img_b64 = base64.b64encode(f.read()).decode("utf-8")
        st.markdown(f'<div class="profile-container"><img src="data:image/jpeg;base64,{img_b64}" class="profile-img"></div>', unsafe_allow_html=True)
    except:
        pass

    if st.session_state.lang == "en":
        st.markdown("<h1 class='title-animation'>Welcome To My Account 👋</h1>", unsafe_allow_html=True)
        st.markdown("<p class='subtitle-animation'>My social media accounts</p>", unsafe_allow_html=True)
    else:
        st.markdown("<h1 class='title-animation'>أهلاً بك في حسابي 👋</h1>", unsafe_allow_html=True)
        st.markdown("<p class='subtitle-animation'>حساباتي على وسائل التواصل الاجتماعي</p>", unsafe_allow_html=True)

    social_html = '''
    <div class="social-container">
        <a href="https://www.instagram.com/meran.alyas/?__pwa=1" target="_blank" class="social-btn insta-btn"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.snapchat.com/add/meran.alyas" target="_blank" class="social-btn snap-btn"><i class="fa-brands fa-snapchat"></i></a>
        <a href="https://www.threads.net/@meran.alyas" target="_blank" class="social-btn threads-btn"><i class="fa-brands fa-threads"></i></a>
    </div>
    '''
    st.markdown(social_html, unsafe_allow_html=True)

elif st.session_state.current_page == "about":
    title_about = "نبذة عني 👤" if st.session_state.lang == "ar" else "About Me 👤"
    st.markdown(f"<h2 style='text-align: center; color: #00b4d8; position: relative; z-index: 10;'>{title_about}</h2>", unsafe_allow_html=True)
    st.markdown('<div class="water-banner-card"><p style="font-size: 20px; font-weight: 700; color: #00b4d8; margin: 0;">🤖 Owner of TIGER Bot 🐅</p></div>', unsafe_allow_html=True)

st.markdown('</div>', unsafe_allow_html=True)
            `,
            "IMG_20240908_230026_233.jpg": {
                url: "IMG_20240908_230026_233.jpg"
            }
        }
    }, document.getElementById("root"));
    </script>
</body>
</html>
