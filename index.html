<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <!-- أيقونات FontAwesome للروابط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.bio {
            color: #9aa0a6;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #161b26;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #232a3b;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover {
            background: #232a3b;
            border-color: #00ff88;
            color: #00ff88;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>أهلاً بك في موقعي الشخصي</h1>
        <p class="bio">هنا روابطي وحساباتي الشخصية</p>

        <div class="links-container">
            <a href="https://github.com/meran101" target="_blank" class="link-btn">
                <i class="fab fa-github"></i> حسابي على GitHub
            </a>
            <a href="https://t.me" target="_blank" class="link-btn">
                <i class="fab fa-telegram"></i> قناة التليجرام
            </a>
            <a href="https://instagram.com" target="_blank" class="link-btn">
                <i class="fab fa-instagram"></i> حساب الانستغرام
            </a>
        </div>
    </div>

</body>
</html>
