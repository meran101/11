<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Meran Alyas | TIGER Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas للخلفية الرقمية الشاملة */
        #cyberCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0);
        }

        /* تأثير خط الليزر المتحرك */
        .laser-scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            box-shadow: 0 0 10px #00f0ff;
            z-index: 1;
            opacity: 0.6;
            animation: scanlineMove 8s linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        /* Navigation Buttons */
        .nav-container {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.7));
            color: #e2e8f0;
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 14px;
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: center;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.9), rgba(0, 180, 216, 0.8));
            color: #ffffff;
            border-color: rgba(0, 240, 255, 1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(0, 180, 216, 0.3);
            margin: 15px 0;
        }

        /* Page Transitions & Content */
        .page {
            display: none;
            animation: pageSlideIn 0.4s ease-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes pageSlideIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Banner & Profile Styling */
        .profile-header-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .banner-bg {
            width: 100%;
            height: 140px;
            border-radius: 20px;
            background-image: url('download.gif');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.4);
        }

        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: -60px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #020617;
            box-shadow: 0px 0px 25px rgba(0, 240, 255, 0.8);
            background-color: #020617;
        }

        .profile-name {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-top: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 180, 216, 0.6);
        }

        .title-animation {
            text-align: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .subtitle-animation {
            text-align: center;
            color: #00f0ff;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Social Links */
        .social-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .social-btn:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }

        .insta-btn { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .snap-btn { background: #FFFC00; color: #000000; }
        .threads-btn { background: #101010; color: #ffffff; border: 1px solid #333333; }

        /* About & Contact Card */
        .water-banner-card {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.35), rgba(0, 180, 216, 0.2)), rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.6);
            border-radius: 20px;
            padding: 25px;
            margin-top: 15px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
        }

        /* Bot Link Button Styling */
        .bot-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            text-decoration: none;
            border: 1px solid rgba(0, 240, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transition: all 0.3s ease;
        }

        .bot-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.9);
            background: linear-gradient(135deg, #00d4ff, #0096c7);
        }

        /* Discord Button Styling */
        .discord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            padding: 14px 28px;
            background: #5865F2;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
            transition: all 0.3s ease;
        }

        .discord-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.9);
            background: #4752C4;
        }
    </style>
</head>
<body>

    <canvas id="cyberCanvas"></canvas>
    <div class="laser-scanline"></div>

    <div class="container">
        <!-- شريط التنقل -->
        <div class="nav-container">
            <button class="nav-btn" id="homeBtn" onclick="showPage('home')"><i class="fa-solid fa-house"></i> Home</button>
            <button class="nav-btn" id="aboutBtn" onclick="showPage('about')"><i class="fa-solid fa-user"></i> About</button>
            <button class="nav-btn" id="contactBtn" onclick="showPage('contact')"><i class="fa-solid fa-paper-plane"></i> Contact</button>
            <button class="nav-btn" id="langBtn" onclick="toggleLang()"><i class="fa-solid fa-globe"></i> العربية</button>
        </div>

        <hr>

        <!-- Home Page -->
        <div id="homePage" class="page active">
            <div class="profile-header-wrapper">
                <div class="banner-bg"></div>
                <div class="profile-container">
                    <img src="IMG_20240908_230026_233.jpg" class="profile-img" alt="Meran Alyas">
                </div>
            </div>

            <div class="profile-name">MERAN</div>

            <h1 class="title-animation" id="mainTitle">Welcome To My Account 👋</h1>
            <p class="subtitle-animation" id="subTitle">My social media accounts</p>

            <div class="social-container">
                <a href="https://www.instagram.com/meran.alyas/?__pwa=1" target="_blank" class="social-btn insta-btn"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.snapchat.com/add/meran.alyas" target="_blank" class="social-btn snap-btn"><i class="fa-brands fa-snapchat"></i></a>
                <a href="https://www.threads.net/@meran.alyas" target="_blank" class="social-btn threads-btn"><i class="fa-brands fa-threads"></i></a>
            </div>
        </div>

        <!-- About Page -->
        <div id="aboutPage" class="page">
            <h2 style="text-align: center; color: #00f0ff; margin-bottom: 15px;" id="aboutTitle">About Me 👤</h2>
            <div class="water-banner-card">
                <p style="font-size: 20px; font-weight: 700; color: #00f0ff; margin-bottom: 10px;" id="aboutBotOwner">🤖 Owner of TIGER Bot 🐅</p>
                
                <!-- رابط البوت المضاف حديثاً مع أيقونة الروبوت -->
                <a href="https://TIGER.bot" target="_blank" class="bot-btn">
                    <i class="fa-solid fa-robot"></i> TIGER.bot
                </a>
            </div>
        </div>

        <!-- Contact Page -->
        <div id="contactPage" class="page">
            <h2 style="text-align: center; color: #00f0ff; margin-bottom: 15px;" id="contactTitle">Contact Me ✈️</h2>
            <div class="water-banner-card">
                <p style="font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 15px;" id="contactText">To contact me</p>
                <a href="https://discord.com/users/761216554402185246" target="_blank" class="discord-btn">
                    <i class="fa-brands fa-discord"></i> Discord
                </a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');

        const isMobile = window.innerWidth < 600;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 1. الجسيمات الشبكية المتحركة والتفاعلية في الخلفية
        const netParticleCount = isMobile ? 18 : 40;
        const connectionDistSq = isMobile ? 85 * 85 : 120 * 120;
        const netParticles = [];

        class NetParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * (isMobile ? 0.7 : 1.0);
                this.vy = (Math.random() - 0.5) * (isMobile ? 0.7 : 1.0);
                this.radius = Math.random() * 1.5 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff';
                ctx.fill();
            }
        }

        for (let i = 0; i < netParticleCount; i++) {
            netParticles.push(new NetParticle());
        }

        // 2. الجسيمات المضيئة المتساقطة
        const fallingParticleCount = isMobile ? 25 : 55;
        const fallingParticles = [];

        class FallingParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -10;
                this.speed = Math.random() * 2 + 1;
                this.radius = Math.random() * 1.8 + 0.8;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.trailLength = Math.random() * 12 + 6;
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height + 15) {
                    this.reset(false);
                }
            }

            draw() {
                const gradient = ctx.createLinearGradient(this.x, this.y - this.trailLength, this.x, this.y);
                gradient.addColorStop(0, 'rgba(0, 240, 255, 0)');
                gradient.addColorStop(1, `rgba(0, 240, 255, ${this.opacity})`);

                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.trailLength);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.radius;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < fallingParticleCount; i++) {
            fallingParticles.push(new FallingParticle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < fallingParticles.length; i++) {
                fallingParticles[i].update();
                fallingParticles[i].draw();
            }

            for (let i = 0; i < netParticles.length; i++) {
                netParticles[i].update();
                netParticles[i].draw();

                for (let j = i + 1; j < netParticles.length; j++) {
                    const dx = netParticles[i].x - netParticles[j].x;
                    const dy = netParticles[i].y - netParticles[j].y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < connectionDistSq) {
                        const alpha = 1 - (distSq / connectionDistSq);
                        ctx.beginPath();
                        ctx.moveTo(netParticles[i].x, netParticles[i].y);
                        ctx.lineTo(netParticles[j].x, netParticles[j].y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${(alpha * 0.7).toFixed(2)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Language & Navigation
        let currentLang = 'en';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            if (pageId === 'home') {
                document.getElementById('homePage').classList.add('active');
            } else if (pageId === 'about') {
                document.getElementById('aboutPage').classList.add('active');
            } else if (pageId === 'contact') {
                document.getElementById('contactPage').classList.add('active');
            }
        }

        function toggleLang() {
            if (currentLang === 'en') {
                currentLang = 'ar';
                document.documentElement.dir = 'rtl';
                document.getElementById('homeBtn').innerHTML = '<i class="fa-solid fa-house"></i> الرئيسية';
                document.getElementById('aboutBtn').innerHTML = '<i class="fa-solid fa-user"></i> عني';
                document.getElementById('contactBtn').innerHTML = '<i class="fa-solid fa-paper-plane"></i> تواصل معي';
                document.getElementById('langBtn').innerHTML = '<i class="fa-solid fa-globe"></i> English';
                
                document.getElementById('mainTitle').innerText = 'أهلاً بك في حسابي 👋';
                document.getElementById('subTitle').innerText = 'حساباتي على وسائل التواصل الاجتماعي';
                document.getElementById('aboutTitle').innerText = 'نبذة عني 👤';
                document.getElementById('aboutBotOwner').innerText = '🤖 مالك بوت تايكر 🐅';
                document.getElementById('contactTitle').innerText = 'تواصل معي ✈️';
                document.getElementById('contactText').innerText = 'للتواصل معي';
            } else {
                currentLang = 'en';
                document.documentElement.dir = 'ltr';
                document.getElementById('homeBtn').innerHTML = '<i class="fa-solid fa-house"></i> Home';
                document.getElementById('aboutBtn').innerHTML = '<i class="fa-solid fa-user"></i> About';
                document.getElementById('contactBtn').innerHTML = '<i class="fa-solid fa-paper-plane"></i> Contact';
                document.getElementById('langBtn').innerHTML = '<i class="fa-solid fa-globe"></i> العربية';
                
                document.getElementById('mainTitle').innerText = 'Welcome To My Account 👋';
                document.getElementById('subTitle').innerText = 'My social media accounts';
                document.getElementById('aboutTitle').innerText = 'About Me 👤';
                document.getElementById('aboutBotOwner').innerText = '🤖 Owner of TIGER Bot 🐅';
                document.getElementById('contactTitle').innerText = 'Contact Me ✈️';
                document.getElementById('contactText').innerText = 'To contact me';
            }
        }
    </script>
</body>
